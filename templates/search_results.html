<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - "{{ keyword }}"</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/测试1.css') }}">
    <style>
        /* 搜索结果页面特定样式 */
        .search-header {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e9ecef;
        }
        .search-header h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
        }
        .search-result-count {
            color: #666;
            font-size: 16px;
        }
        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 18px;
        }
        .back-home {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .back-home:hover {
            background-color: #45a049;
        }
        /* 搜索框样式 */
        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }
        .search-box {
            display: flex;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        .search-button {
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>


    <div class="search-header">
        <h1>搜索结果</h1>
        <div class="search-result-count">
            为您找到关于 "{{ keyword }}" 的 {{ result_count }} 个商品
        </div>
    </div>



    {% if goods %}
    <div class="goods-grid">
        {% for good in goods %}
        <div class="good_li" style="background-color: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s;">
            <a href="{{ url_for('goods_detail', goods_id=good.id) }}" style="display: block; text-decoration: none;">
                <div class="img" style="height: 200px; overflow: hidden;">
                    <img src="{{ url_for('static', filename='img/' + good.img) }}" alt="{{ good.name }}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;">
                </div>
                <div class="content" style="padding: 15px;">
                    <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #333; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">{{ good.name }}</h3>
                    <div class="price" style="color: #ff4757; font-size: 18px; font-weight: bold; margin-bottom: 8px;">¥{{ good.price }}</div>
                    <div class="sales" style="color: #999; font-size: 12px;">已售 {{ good.sales }}</div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-result">
        <p>没有找到与 "{{ keyword }}" 相关的商品</p>
        <a href="{{ url_for('index') }}" class="back-home">返回首页</a>
    </div>
    {% endif %}

    <script>
        // 添加商品卡片悬停效果
        document.querySelectorAll('.good_li').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-5px)';
                card.style.boxShadow = '0 5px 15px rgba(0,0,0,0.15)';
                const img = card.querySelector('img');
                img.style.transform = 'scale(1.05)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
                card.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
                const img = card.querySelector('img');
                img.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
