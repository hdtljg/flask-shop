<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>幸运抽奖</title>
    <script type="text/javascript" src="/js/jquery-3.3.1.min.js"></script>
    <script type="text/javascript" src="/js/select.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            /* 更换为星空背景图 */
            background: url('/img/timg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 添加星空动画效果 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: twinkle 10s linear infinite;
            pointer-events: none;
        }

        /* 抽奖容器 */
        #main {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        /* 标题样式 */
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(102, 126, 234, 0.8);
            margin-bottom: 30px;
        }


        /* 抽奖箱样式 */
        #box {
            background: linear-gradient(135deg, rgba(147, 206, 251, 0.9) 0%, rgba(87, 144, 245, 0.9) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* 抽奖箱装饰 */
        #box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 10%, transparent 10.01%);
            background-size: 10px 10px;
            animation: rotate 20s linear infinite;
        }

        /* 头像容器 */
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            z-index: 1;
        }

        /* 头像样式 */
        #touxiang {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        #touxiang:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 255, 255, 0.8);
        }

        /* 头像光环 */
        .avatar-container::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            animation: pulse 2s ease-in-out infinite;
        }

        /* 名字样式 */
        #name {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 255, 255, 0.8);
            min-height: 30px;
            line-height: 30px;
            position: relative;
            z-index: 1;
        }

        /* 按钮容器 */
        #choose_stutent {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* 按钮样式 */
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        button:hover::before {
            left: 100%;
        }

        /* 开始按钮 */
        #start {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        #start:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25), 0 0 20px rgba(76, 175, 80, 0.4);
        }

        #start:active {
            transform: translateY(0);
        }

        /* 停止按钮 */
        #stop {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        #stop:hover {
            background: linear-gradient(135deg, #d32f2f, #c62828);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25), 0 0 20px rgba(244, 67, 54, 0.4);
        }

        #stop:active {
            transform: translateY(0);
        }

        /* 动画效果 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        /* 抽奖动画 */
        .lottery-animation {
            animation: shake 0.1s infinite;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 结果出现动画 */
        .result-animation {
            animation: bounce-in 0.5s ease;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.8);
        }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            #main {
                padding: 30px 20px;
                margin: 20px;
            }

            .title {
                font-size: 24px;
            }

            #touxiang {
                width: 100px;
                height: 100px;
            }

            #name {
                font-size: 20px;
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
            }

            #choose_stutent {
                flex-direction: column;
                align-items: center;
            }

            #choose_stutent button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <h1 class="title">幸运抽奖</h1>

        <div id="box">
            <div class="avatar-container">
                <img src="/img/2.jpg" id="touxiang" alt="头像">
            </div>
            <span id="name">点击开始抽奖</span>
        </div>

        <div id="choose_stutent">
            <button id="start">开始抽奖</button>
            <button id="stop">停止抽奖</button>
        </div>
    </div>

    <script>
        $(function() {
            var timer = null;
            var user_data = getUserData();

            // 开始抽奖
            $("#start").click(function() {
                // 防止重复点击
                if (timer != null) {
                    return;
                }

                // 添加抽奖动画
                $('#box').addClass('lottery-animation');
                $('#name').text('抽奖中...');

                // 设置定时器快速切换用户
                timer = setInterval(function() {
                    getRandomUser(user_data);
                }, 50);
            });

            // 停止抽奖
            $('#stop').click(function() {
                if (timer != null) {
                    clearInterval(timer);
                    timer = null;

                    // 移除抽奖动画，添加结果动画
                    $('#box').removeClass('lottery-animation');
                    $('#box').addClass('result-animation');

                    // 2秒后移除结果动画，以便下次抽奖
                    setTimeout(function() {
                        $('#box').removeClass('result-animation');
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
