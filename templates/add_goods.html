<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加商品 - 管理员界面</title>
{#    <link rel="stylesheet" href="/static/css/style.css">#}
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-size: 18px;
            font-family: "微软雅黑", Arial, sans-serif;
            /* 星空背景 */
            background: url('/static/img/timg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 星空闪烁动画效果 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: twinkle 10s linear infinite;
            pointer-events: none;
        }

        /* 容器样式 */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

              /* 修改h1标题样式，大幅减小底部间距 */
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px; /* 进一步减小到底部间距 */
            padding-bottom: 5px; /* 进一步减小到底部内边距 */
            border-bottom: 3px solid #3498db;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* 完全移除表单组的顶部间距 */
        .form-group {
            margin-top: 0;
            position: relative;
        }

        /* 为表单组添加一个很小的底部间距，保持组与组之间的适当距离 */
        .form-group {
            margin-bottom: 15px;
        }

        /* 特别针对第一个表单组添加样式，确保它紧贴标题 */
        form .form-group:first-of-type {
            margin-top: 5px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            transition: all 0.3s ease;
        }

        .form-group:focus-within label {
            color: #3498db;
            transform: translateX(5px);
        }

        /* 输入框样式 */
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            transform: translateY(-2px);
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
            min-height: 80px;
            max-height: 300px;
        }

        /* 文件上传样式 - 修复溢出问题 */
        .file-upload-container {
            width: 100%;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .file-upload-container:hover {
            border-color: #3498db;
            background-color: #f0f7fb;
        }

        .file-upload-container input[type="file"] {
            width: 100%;
            padding: 8px 0;
            cursor: pointer;
            outline: none;
            border: none;
            background: transparent;
        }

        /* 文件上传文本样式 */
        .file-upload-hint {
            color: #666;
            margin-top: 8px;
            font-size: 14px;
            word-break: break-word;
        }

        /* 必填字段标记 */
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            min-width: 120px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #1f6dad);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #7f8c8d, #6c757d);
            color: white;
            min-width: 120px;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(127, 140, 141, 0.4);
        }

        /* 消息提示样式 */
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            box-shadow: 0 2px 8px rgba(248, 215, 218, 0.4);
            animation: slideIn 0.3s ease;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            box-shadow: 0 2px 8px rgba(212, 237, 218, 0.4);
            animation: slideIn 0.3s ease;
        }

        /* 表单操作区样式 - 修复布局溢出 */
        .form-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }



        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: center;
            }

            .container {
                padding: 20px;
                margin: 10px auto;
                width: 100%;
                max-width: 100%;
            }

            h1 {
                font-size: 22px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group input,
            .form-group textarea {
                font-size: 15px;
                padding: 10px 12px;
            }

            .form-actions {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
                padding: 14px;
                font-size: 17px;
            }
        }

        /* 确保移动设备上所有内容都在容器内 */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .file-upload-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>添加新商品</h1>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% elif request.args.get('message') %}
        <div class="success-message">
            {{ request.args.get('message') }}
        </div>
        {% endif %}

        <form action="/admin/add_goods_process" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">商品名称 <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="请输入商品名称" required>
            </div>

            <div class="form-group">
                <label for="price">商品价格 <span class="required">*</span></label>
                <input type="number" id="price" name="price" step="0.01" min="0" placeholder="请输入商品价格" required>
            </div>

            <div class="form-group">
                <label for="sales">初始销量</label>
                <input type="number" id="sales" name="sales" min="0" placeholder="请输入初始销量（默认为0）" value="0">
            </div>

            <div class="form-group">
                <label for="detail">商品详情 <span class="required">*</span></label>
                <textarea id="detail" name="detail" placeholder="请输入商品详细描述" required></textarea>
            </div>

            <div class="form-group">
                <label for="img">商品图片</label>
                <div class="file-upload-container">
                    <input type="file" id="img" name="img" accept="image/*">
                </div>
                <div class="file-upload-hint">支持JPG、PNG、GIF等图片格式</div>
            </div>

            <div class="form-actions">
                <a href="/admin_dashboard" class="btn btn-secondary">返回仪表板</a>
                <button type="submit" class="btn btn-primary">添加商品</button>
            </div>
        </form>
    </div>
</body>
</html>
