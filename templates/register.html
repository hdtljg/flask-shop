<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易邮箱注册</title>
    <link rel="stylesheet" href="css/lab2.css">
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="../js/isFuntion.js"></script>
    <script src="../js/lab.js"></script>


</head>
<body>

    <div id="wrap">


        <div id="reg_wrap">
            <div id="title_wrap">

                <h1>欢迎注册网页免费账号</h1>
                <!-- <span>以字母开头，支持字母、数字组合</span> -->
            </div>

            <div id="form_box">
                <form action="/pai/register" id="userForm" method="post" enctype="multipart/form-data">

                    <div class="item">

                        <input type="text" name="username" placeholder="用户名" id="username" class="input_item">

                        <div class="tip"></div>

                        <!-- <div class="text">@163.com</div> -->

                    </div>

                    <div class="item">

                        <input type="password" name="pwd" placeholder="密码" id="password" class="input_item">
                        <div class="tip"></div>

                        <!-- <div id=""></div> -->
                         <i id="psd_icon"></i>

                    </div>

                    <div class="item">

                        <input type="text" name="tel" placeholder="手机号码" id="tel" class="input_item">
                        <div class="tip"></div>


                    </div>

                    <div class="item">

                        <input type="file" name="img" placeholder="头像" id="img">
                        <div class="tip">上传头像</div>


                    </div>

                    <div class="service">

                        <input type="checkbox" id="service">
                        <label >
                            同意
                            <a href="#">《服务条款》</a>、
                            <a href="#">《服务条款》</a>
                            和<a href="#">《服务条款》</a>
                        </label>
                    </div>

                    <div id="reg_btn">立即注册</div>
                    <a href="/login" style="color: blue">前往登录</a>
                    <div class="item" style="color: red">
                        {% for msg in get_flashed_messages() %}
                            {{ msg +",重名"}}
                        {% endfor %}
                    </div>
                </form>
            </div>

        </div>


    </div>

</body>
</html>
