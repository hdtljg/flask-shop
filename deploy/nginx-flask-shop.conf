server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 与 MAX_CONTENT_LENGTH_MB 保持一致或略大
    client_max_body_size 16m;

    access_log /var/log/nginx/flask-shop.access.log;
    error_log  /var/log/nginx/flask-shop.error.log;

    # 如果 .env 里把 UPLOAD_FOLDER 指到了外部目录，取消下面注释并改成实际路径
    # location /static/img/upload/ {
    #     alias /var/lib/flask-shop/upload/;
    # }

    # 静态资源交给 Nginx，减少 Python 进程压力
    location /static/ {
        alias /opt/flask-shop/static/;
        expires 7d;
        access_log off;
    }

    location /css/ {
        alias /opt/flask-shop/static/css/;
        expires 7d;
        access_log off;
    }

    location /js/ {
        alias /opt/flask-shop/static/js/;
        expires 7d;
        access_log off;
    }

    location /img/ {
        alias /opt/flask-shop/static/img/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
